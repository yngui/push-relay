[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "push-relay"
version = "0.1.0"
description = "Web Push relay sender + per-client toolkit"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "requests>=2.31",
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
include = ["push_relay*"]
